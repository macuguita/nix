[package]
name = "record"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nix = { version = "0.29", features = ["signal"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"