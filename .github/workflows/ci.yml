name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check configurations
    strategy:
      matrix:
        include:
          - name: desktop
            system: x86_64-linux
            attr: nixosConfigurations.desktop.config.system.build.toplevel.drvPath

          - name: mac-raul
            system: aarch64-darwin
            attr: darwinConfigurations.mac-raul.system.drvPath

    runs-on: ${{ matrix.system == 'aarch64-darwin' && 'macos-14' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check configuration
        run: nix eval .#${{ matrix.attr }}